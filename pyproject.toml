[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextplorer"
version = "0.1.0"
description = "Portable Nextcloud links + application-level locking for Nautilus/Dolphin"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests",
    "cryptography",
]

[project.scripts]
nextplorer = "nextplorer.cli:main"

[tool.setuptools.package-data]
"nextplorer._integrations" = ["*.desktop"]
